(() => {

const entrySelectionStyles=`
body[data-view=home] .entry-link:is(:active,:focus,:focus-visible,.active,[aria-current="page"]){background:var(--lime);border-color:var(--lime);color:#080811;text-shadow:none;box-shadow:none}

`;
const weatherReadoutStyles=`
#weather-readout{position:fixed;z-index:7;left:24px;bottom:23px;max-width:calc(100vw - 220px);color:rgba(220,224,232,.56);font:400 9.6px/1.45 var(--mono,monospace);letter-spacing:.045em;white-space:nowrap;pointer-events:none;text-shadow:0 1px 8px #000}
#weather-readout[data-simulated=true]{color:rgba(204,255,0,.64)}
body[data-view=inside] #weather-readout{display:none}
@media(max-width:560px){#weather-readout{left:16px;bottom:22px;max-width:calc(100vw - 185px);font-size:9px;overflow:hidden;text-overflow:ellipsis}}
`;
const solarStyles=`
#solar-atmosphere{position:fixed;z-index:1;inset:0;overflow:hidden;pointer-events:none;isolation:isolate}
#dawn-glow,#clear-sky{position:absolute;inset:0;opacity:0;will-change:opacity}
#clear-sky{background:linear-gradient(152deg,rgba(255,218,162,.10),transparent 34%),linear-gradient(to bottom,rgba(115,151,196,.045),transparent 42%);transition:opacity .8s linear}

body[data-view=inside] #solar-atmosphere{opacity:.45}
@media(prefers-reduced-motion:reduce){#dawn-glow,#clear-sky{transition:none}}
`;
const landing=`
<nav id="site-language" class="site-language" aria-label="Language"><button type="button" data-language="zh" aria-pressed="true">中文</button><button type="button" data-language="en" aria-pressed="false">EN</button></nav>
<a class="return-home" href="#/home" aria-label="返回首页" hidden><svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><path d="M13 8H3m5-5L3 8l5 5" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" stroke-linejoin="miter"/></svg><span class="return-label">首页</span></a>
<main class="entry" id="landing" aria-label="0086 Studios"><div class="entry-content">
<img class="entry-logo" src="assets/0086-logo.png" width="604" height="211" alt="0086 Studios">
<p class="entry-description">AI-DRIVEN CREATIVE LAB<br>SHENZHEN, CHINA</p>
<nav class="entry-menu" aria-label="进入网站">
<a class="entry-link" href="#/works?type=interactive" data-home-label="interactive">互动装置</a>
<a class="entry-link" href="#/works?type=space" data-home-label="space">空间</a>
<a class="entry-link" href="#/works?type=exhibition" data-home-label="exhibition">展览</a>
<a class="entry-link" href="#/works?type=ip" data-home-label="ip">IP设计</a>
<a class="entry-link about-entry" href="#/about" data-home-label="about">about us</a>
</nav><nav class="entry-utility" aria-label="更多"><a href="#/works">Selected Works</a><a href="#/ai">AI</a><a href="mailto:contact@0086studios.com">Contact ↗</a></nav>
</div></main><div id="solar-atmosphere" aria-hidden="true"><i id="clear-sky"></i><i id="dawn-glow"></i></div><div id="weather-readout" role="status" aria-live="polite">深圳天气连接中</div>
`;
function interfaceSetup(){
  const copies={zh:{all:'Selected Works',interactive:'互动装置',space:'空间',exhibition:'展览',ip:'IP设计',other:'创意技术',about:'about us'},en:{all:'Selected Works',interactive:'Interactive Installations',space:'Space',exhibition:'Exhibitions',ip:'IP Design',other:'Creative Technology',about:'About us'}};
  const setLanguage=lang=>{
    const copy=copies[lang]||copies.zh;document.documentElement.lang=lang==='en'?'en':'zh-CN';
    Object.assign(LABELS,copy);
    const homeLink=document.querySelector('.return-home');
    homeLink.querySelector('.return-label').textContent=lang==='en'?'HOME':'首页';
    homeLink.setAttribute('aria-label',lang==='en'?'Back to home':'返回首页');
    document.querySelectorAll('[data-home-label]').forEach(el=>el.textContent=copy[el.dataset.homeLabel]);
    document.querySelectorAll('.nav a[data-type]').forEach(el=>{const text=copy[el.dataset.type];if(el.firstChild.nodeType===Node.TEXT_NODE)el.firstChild.textContent=text+' '});
    document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===lang)));
    try{localStorage.setItem('0086-language',lang)}catch{}route();
  };
  document.querySelectorAll('[data-language]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.language)));
  let language='zh';try{language=localStorage.getItem('0086-language')||'zh'}catch{}setLanguage(language);
  document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.project > summary')){e.preventDefault();e.target.click()}});
  document.documentElement.dataset.designRevision='volumetric-corelight-v24';
}
const config={version:24,contentBase:root.href,weatherEndpoint:weather,weatherProvider:'open-meteo'};
document.getElementById('retry').onclick=()=>location.reload();
const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
Promise.all([
 fetch(new URL('preview-0086-source.html?v=10',root),{signal:controller.signal,cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}),
 fetch(new URL('assets/preview-catalogue-v10.json?v=11',root),{signal:controller.signal,cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('Catalogue HTTP '+r.status);return r.json();})
]).then(([html,catalogue])=>{
  if(catalogue.version!==10||!Array.isArray(catalogue.projects)||catalogue.projects.length<23)throw new Error('Catalogue mismatch');
  if(!html.includes('SOURCE_ROWS')||!html.includes('state=readRoute();const works'))throw new Error('Preview source mismatch');
  html=html.replace('<head>','<head><meta name="description" content="0086 Studios — 深圳创意科技工作室：互动装置、沉浸式空间、展览与 IP 设计。Interactive installations, immersive spaces, exhibitions and IP design."><meta name="generator" content="0086-official-v24"><link rel="canonical" href="https://0086studios.xyz/"><meta property="og:title" content="0086 Studios™"><meta property="og:description" content="互动装置 · 空间 · 展览 · IP设计"><meta property="og:url" content="https://0086studios.xyz/"><meta property="og:image" content="https://0086studios.xyz/assets/0086-logo.png"><link rel="icon" href="/assets/0086-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">'+open+'window.SITE_CONFIG='+JSON.stringify(config)+';window.__0086Catalogue='+JSON.stringify(catalogue).replace(/</g,'\\u003c')+';'+close);
  html=html.replace('</head>','<link rel="stylesheet" href="assets/preview-catalogue-v10.css?v=10"></head>');
  html=html.replace('</head>','<link rel="stylesheet" href="assets/preview-0086-layout-v4.css?v=4"><link rel="stylesheet" href="assets/preview-0086-light-v6.css?v=7"><style id="language-neutral">.site-language{border-color:rgba(255,255,255,.25)}.site-language button[aria-pressed=true]{background:rgba(255,255,255,.1);color:#fff}</style></head>');
  html=html.replace('</head>','<style id="return-home-clean">'+returnStyles+'</style><style id="v16-mobile-spacing">'+v16Styles+'</style><style id="selection-green">.side .nav a.active{background:var(--lime);border-color:var(--lime);color:#080811}'+entrySelectionStyles+'</style><style id="weather-readout-style">'+weatherReadoutStyles+'</style><style id="solar-atmosphere-style">'+solarStyles+'</style></head>');
  html=html.replace(/<button\b[^>]*\bdata-motion\b[^>]*>[\s\S]*?<\/button>/g,'');
  html=html.replace('<body>','<body data-view="home">');
  html=html.replace('<div class="shell">',landing+'<div class="shell" hidden>');
  html=html.replace('<nav class="nav" aria-label="作品分类">','<div class="side-heading">Selected Works</div><nav class="nav" aria-label="作品分类">');
  html=html.replace('class="brand" href="#/works"','class="brand" href="#/home"').replace('href="#/works" aria-label="0086 Studios 首页"','href="#/home" aria-label="0086 Studios 首页"');
  html=html.replace("location.hash.slice(1)||'/works'","location.hash.slice(1)||'/home'");
  html=html.replace("view:['/about','/ai'].includes(path)","view:['/home','/about','/ai'].includes(path)");
  html=html.replace('state=readRoute();const works',`state=readRoute();const home=state.view==='home';document.body.dataset.view=home?'home':'inside';$('#landing').hidden=!home;$('.shell').hidden=home;$('.return-home').hidden=home;if(home){document.title='0086 Studios™';return;}const works`);
  const graphicsStart=html.indexOf('// Geometry is reconstructed continuously');
  const graphicsEnd=html.indexOf('// Read-only diagnostics;',graphicsStart);
  if(graphicsStart<0||graphicsEnd<graphicsStart)throw new Error('Renderer boundary not found');
  html=html.slice(0,graphicsStart)+html.slice(graphicsEnd);
  html=html.replace('resize();run();route();','route();');
  html=html.replace('target=weatherToField(cached.payload);cacheAt','target=weatherToField(cached.payload);window.__0086WeatherRaw=cached.payload;cacheAt');
  html=html.replace('target=weatherToField(payload);const fetched','target=weatherToField(payload);window.__0086WeatherRaw=payload;const fetched');
  html=html.replace("const CACHE_KEY='0086-weather-v1'","const CACHE_KEY='0086-weather-volumetric-v24'");
  html=html.replace('current:{...current}','current:{...(window.__0086Field?.weather||current)}');
  html=html.replace('</body>',open+'('+interfaceSetup.toString()+')();'+close+'<scr'+'ipt src="assets/preview-0086-field-v24.js?v=24" defer>'+close+'<scr'+'ipt src="assets/preview-0086-music-v7.js?v=7" defer>'+close+'</body>');
  clearTimeout(timeout);document.open();document.write(html);document.close();
}).catch(error=>{clearTimeout(timeout);const line=document.querySelector('.line');if(line)line.hidden=true;const message=document.getElementById('message');if(message){message.textContent='页面暂时未能载入，请重试。';message.hidden=false;document.getElementById('retry').hidden=false}console.error(error)});
})();
</script>
</body></html>

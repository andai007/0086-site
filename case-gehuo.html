<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>隔火 | 0086</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;600;800&display=swap');
    :root { --black:#000; --white:#fff; --gray-mid:#e0e0e0; --gray-dark:#777; --red:#c83a3a; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:#fff;color:#000;min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#d8d8d8 8px,transparent 8px);background-size:100px 100px;background-position:50px 50px;pointer-events:none;z-index:0;}
    a,a:visited{color:#000;}
    header{position:sticky;top:0;background:#fff;z-index:10;padding:18px 24px;display:flex;align-items:center;gap:16px;}
    .brand{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;}
    .logo-img{height:28px;display:block;}
    .actions{margin-left:auto;display:flex;gap:16px;}
    .action{background:#000;color:#fff;padding:8px 14px;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;}
    main{position:relative;z-index:1;padding:16px 24px 60px;}
    .hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:8px;}
    .hero-media{width:100%;aspect-ratio:16/9;background:#f4f4f4;overflow:hidden;}
    .hero-media img{width:100%;height:100%;object-fit:cover;display:block;}
    .hero-title{font-family:'Playfair Display',serif;font-size:42px;line-height:1.05;margin-bottom:10px;}
    .meta{font-size:13px;color:#777;margin:8px 0 12px;}
    .summary{font-size:14px;line-height:1.7;color:#111;}
    .info{margin-top:14px;border-top:1px solid #eee;padding-top:10px;font-size:12px;color:#444;display:grid;gap:6px;}
    .section-title{font-size:12px;letter-spacing:1px;color:#666;margin:24px 0 10px;text-transform:uppercase;}
    .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
    .gallery img{width:100%;height:180px;object-fit:cover;display:block;background:#f4f4f4;}
    .videos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
    .video-item video{width:100%;height:220px;object-fit:cover;display:block;background:#111;}
    .video-item figcaption{font-size:12px;color:#666;margin-top:6px;}
    .back{margin-top:18px;display:inline-block;font-size:13px;}
    @media(max-width:1100px){.hero{grid-template-columns:1fr;}.gallery{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:700px){.gallery{grid-template-columns:1fr;}.videos{grid-template-columns:1fr;}.hero-title{font-size:32px;}}
  
    /* Hero stretch fill */
    .hero{align-items:stretch;}
    .hero-img{height:100%;}
    .hero-media{height:100%;}
    .hero-media img{height:100%;object-fit:cover;}

  
        /* ========== 0086 Banner Sync ========== */
        :root {
            --black: #000000;
            --white: #ffffff;
            --red: #ff0000;
            --gray-light: #f0f0f0;
            --gray-mid: #e0e0e0;
            --gray-dark: #999999;
            --logo-red-filter: brightness(0) saturate(100%) invert(10%) sepia(95%) saturate(7000%) hue-rotate(0deg) brightness(85%) contrast(120%);
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 10px;
            z-index: 1000;
            display: flex;
            align-items: center;
            height: 51px;
            padding: 0 24px;
            background: var(--white);
            border-bottom: 1px solid var(--gray-mid);
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 12px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.2px;
            color: var(--black);
            text-decoration: none;
        }

        .logo-tm {
            font-size: 9px;
            font-weight: 700;
            vertical-align: super;
        }

        .logo-type {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            width: auto;
            border-right: none;
            animation: none;
        }

        .logo-img {
            height: 51px;
            display: block;
            transform: scale(0.5);
            transform-origin: left center;
        }

        .header-nav {
            display: flex;
            align-items: center;
            height: 100%;
            margin-right: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            padding: 0 24px;
            min-width: 180px;
            background: var(--gray-light);
            border-right: 1px solid var(--gray-mid);
            text-decoration: none;
            color: var(--black);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2px;
            transition: background 0.35s, transform 0.2s, box-shadow 0.2s;
        }

        .nav-item:hover {
            background: #e8e8e8;
            transform: translateY(1px);
            box-shadow: inset 0 2px 0 rgba(0,0,0,0.15);
        }

        .nav-dot {
            width: 28px;
            height: 28px;
            background: var(--white);
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
            flex-shrink: 0;
            position: relative;
        }

        .nav-dot::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: var(--red);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }


        .header-right {
            margin-left: auto;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .header-icon {
            font-size: 18px;
            color: var(--red);
            cursor: pointer;
        }

        .header-icon-img {
            height: 51px;
            display: block;
            opacity: 0;
            position: absolute;
            pointer-events: none;
        }

        .header-icon-canvas {
            height: 51px;
            display: block;
        }

        main {
            padding-top: 56px;
        }

        @media (max-width: 1024px) {
            .nav-item {
                min-width: 140px;
                padding: 0 16px;
                font-size: 13px;
            }
        }

        @media (max-width: 768px) {
            header {
                height: 51px;
                padding: 0 16px;
            }
            .header-nav {
                display: none;
            }
            main {
                padding-top: 48px;
            }
        }
            
    
        .corner-icons {
            position: fixed;
            right: 10px;
            bottom: 0;
            z-index: 2;
            display: flex;
            align-items: center;
        }

        .corner-icon-mask {
            display: inline-block;
            overflow: hidden;
            width: 0;
        }

        .corner-icon-mask img {
            height: 51px;
            width: auto;
            display: block;
        }

        @keyframes cornerType {
            0% { width: 0; }
            100% { width: 100%; }
        }

        .corner-icons.is-typing .corner-icon-mask {
            animation: cornerType 1.4s steps(18, end) both;
        }

    

        
        
        
        
        
        /* nav dot override to ensure perfect circle */


        .nav-item:hover .nav-dot::after {
            opacity: 1;
        }


        .header-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--black);
            letter-spacing: 0.2px;
            margin-top: 8px;
            margin-right: -16px;
            padding-right: 24px;
            transform: translate(130px, 20px);
        }

        .header-back img {
            height: 18px;
            width: auto;
            display: block;
        }


        .header-back:active img {
            filter: brightness(0) saturate(100%) invert(12%) sepia(90%) saturate(4500%) hue-rotate(350deg) brightness(95%) contrast(120%);
        }


        .header-back {
            position: relative;
        }

        .header-back::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 18px;
            height: 18px;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #ff2b2b 0%, #ff7a00 100%);
            -webkit-mask: url('assets/icons/icon2.svg') no-repeat center / contain;
            mask: url('assets/icons/icon2.svg') no-repeat center / contain;
            opacity: 0;
            pointer-events: none;
        }

        .header-back:active::before {
            opacity: 1;
        }

        .header-back:active img {
            opacity: 0;
        }


        .nav-item.is-active {
            background: #cfcfcf;
            box-shadow: inset 0 2px 0 rgba(0,0,0,0.15);
        }

        .nav-item.is-active .nav-dot::after {
            opacity: 1;
        }
</style>
</head>

    <div class="corner-icons" aria-hidden="true">
        <div class="corner-icon-mask">
            <img src="assets/icons/icon4.svg" alt="">
        </div>
    </div>


    <script>
        (function () {
            const icon = document.querySelector('.corner-icons');
            if (!icon) return;
            const loop = () => {
                icon.classList.remove('is-typing');
                void icon.offsetWidth;
                icon.classList.add('is-typing');
                const delay = 800 + Math.random() * 1200;
                const duration = 1400;
                setTimeout(loop, delay + duration);
            };
            loop();
        })();
    </script>

<script>
    (function () {
      const nav = document.querySelector('.header-nav');
      if (!nav) return;
      nav.addEventListener('click', (event) => {
        const link = event.target.closest('.nav-item');
        if (!link) return;
        nav.querySelectorAll('.nav-item').forEach((el) => el.classList.remove('is-active'));
        link.classList.add('is-active');
      });
    })();
  </script>

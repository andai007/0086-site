<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0086 Studios Home V2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Cormorant+Garamond:wght@500;600;700&display=swap');
    :root {
      --ink: #1a1a1a;
      --paper: #ececec;
      --line: #cfcfcf;
      --win-blue: #0e63c7;
      --win-blue-2: #2f84e6;
      --win-red: #d8261f;
      --hero-h: min(68vw, 980px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background: #1a1410;
      color: var(--ink);
      min-height: 100vh;
      margin: 0;
    }

    .notice-bar {
      display: none;
    }

    .top-row {
      position: absolute;
      inset: 24px 20px auto 20px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .burst-mark {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff 0 2px, transparent 3px 100%),
        conic-gradient(from 0deg, #fff 0 8deg, transparent 8deg 16deg, #fff 16deg 24deg, transparent 24deg 32deg, #fff 32deg 40deg, transparent 40deg 48deg, #fff 48deg 56deg, transparent 56deg 64deg, #fff 64deg 72deg, transparent 72deg 80deg, #fff 80deg 88deg, transparent 88deg 96deg, #fff 96deg 104deg, transparent 104deg 112deg, #fff 112deg 120deg, transparent 120deg 128deg, #fff 128deg 136deg, transparent 136deg 144deg, #fff 144deg 152deg, transparent 152deg 160deg, #fff 160deg 168deg, transparent 168deg 176deg, #fff 176deg 184deg, transparent 184deg 192deg, #fff 192deg 200deg, transparent 200deg 208deg, #fff 208deg 216deg, transparent 216deg 224deg, #fff 224deg 232deg, transparent 232deg 240deg, #fff 240deg 248deg, transparent 248deg 256deg, #fff 256deg 264deg, transparent 264deg 272deg, #fff 272deg 280deg, transparent 280deg 288deg, #fff 288deg 296deg, transparent 296deg 304deg, #fff 304deg 312deg, transparent 312deg 320deg, #fff 320deg 328deg, transparent 328deg 336deg, #fff 336deg 344deg, transparent 344deg 352deg, #fff 352deg 360deg);
      opacity: 0.9;
    }

    .top-icons {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .top-icons span {
      display: inline-flex;
      width: 16px;
      height: 16px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.75);
      color: #fff;
      font-size: 10px;
      line-height: 1;
      opacity: 0.9;
    }

    .hero-wrap {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 560px;
      margin: 0;
      overflow: hidden;
      background: #1a1410;
    }

    .ambient-top {
      position: absolute;
      top: calc(-12% + 50px);
      left: 30%;
      width: 40%;
      height: 22%;
      background: radial-gradient(ellipse at 50% 100%, rgba(255, 50, 15, 0.45) 0%, rgba(255, 35, 10, 0.15) 48%, transparent 75%);
      transform-origin: 50% 90%;
      pointer-events: none;
      mix-blend-mode: normal;
      opacity: 0;
      visibility: hidden;
      transition: opacity 500ms ease, visibility 0s linear 500ms;
      z-index: 12;
    }

    .glow-overlay {
      position: absolute;
      top: calc(-2% + 50px);
      left: 50%;
      transform: translateX(-50%);
      width: 48%;
      height: 18%;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 500ms ease, visibility 0s linear 500ms;
      z-index: 13;
    }

    .hero-wrap.is-ended .ambient-top,
    .hero-wrap.is-ended .glow-overlay {
      opacity: 1;
      visibility: visible;
      transition: opacity 500ms ease;
    }

    .hero-wrap.is-ended .ambient-top {
      animation: focusInExpandAmbient 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }

    .hero-wrap.is-ended .glow-overlay {
      animation: focusInExpandGlow 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }

    .glow-red {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 70% at 50% 65%, rgba(255, 40, 10, 0.95) 0%, rgba(255, 50, 15, 0.5) 30%, rgba(255, 30, 5, 0.2) 58%, transparent 80%);
      mix-blend-mode: normal;
    }

    .glow-gold {
      position: absolute;
      inset: 5% 15%;
      background: radial-gradient(ellipse 55% 65% at 50% 60%, rgba(255, 200, 60, 0.58) 0%, rgba(255, 180, 40, 0.3) 35%, transparent 70%);
      mix-blend-mode: normal;
    }

    .glow-core {
      position: absolute;
      inset: 15% 25%;
      background: radial-gradient(ellipse 60% 55% at 50% 58%, rgba(255, 245, 210, 0.5) 0%, rgba(255, 225, 160, 0.25) 35%, transparent 68%);
      mix-blend-mode: normal;
    }

    .hero-still,
    .hero-video {
      position: absolute;
      inset: 0;
    }

    .hero-still {
      background-image: url("./0086coover.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 600ms ease;
      pointer-events: none;
      z-index: 2;
    }

    .hero-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 1;
      transition: opacity 600ms ease;
      z-index: 3;
      pointer-events: auto;
      background: #000;
    }

    .hero-video-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 6;
      pointer-events: none;
    }

    .hero-video-overlay button {
      pointer-events: auto;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font: 600 14px/1 Arial, \"Helvetica Neue\", Helvetica, sans-serif;
      padding: 10px 14px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      cursor: pointer;
    }

    .hero-wrap.needs-tap .hero-video-overlay {
      display: flex;
    }

    .hero-sound {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 9;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 350ms ease;
    }

    .hero-sound button {
      pointer-events: auto;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(0, 0, 0, 0.28);
      color: #fff;
      font: 600 13px/1 Arial, \"Helvetica Neue\", Helvetica, sans-serif;
      padding: 9px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      cursor: pointer;
    }

    .hero-wrap.is-ended .hero-sound {
      opacity: 0;
      pointer-events: none;
    }

    .hotspots {
      position: absolute;
      inset: 0;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease 150ms;
      transform: none;
    }

    .hero-wrap.is-ended .hotspots {
      opacity: 1;
      pointer-events: auto;
    }

    .hero-wrap.is-ended .hero-still {
      opacity: 1;
    }

    .hero-wrap.is-ended .hero-video {
      opacity: 0;
      pointer-events: none;
    }

    .hero-hotspot {
      position: absolute !important;
      cursor: pointer !important;
      display: block !important;
      text-decoration: none !important;
      background: transparent !important;
      border: none !important;
      pointer-events: auto !important;
    }

    .hero-hotspot::after {
      display: none;
    }

    .hero-hotspot:focus-visible {
      outline: 1px dashed rgba(0, 0, 0, 0.5);
      outline-offset: 2px;
    }

    body.debug-hotspots .hero-wrap.is-ended .hero-hotspot {
      background: rgba(255, 0, 0, 0.18) !important;
      border: 2px solid rgba(255, 0, 0, 0.92) !important;
    }

      content: 'CLICK';

      width: 100%;

      align-items: center;

      color: #fff;

      font-weight: 500;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);

    .hero-logo-0086 {
      position: absolute;
      left: 50%;
      top: 3.8%;
      width: min(640px, 46vw);
      height: min(240px, 18vw);
      transform: translateX(-50%);
      z-index: 9;
      pointer-events: none;
      user-select: none;
    }

    .hero-logo-0086.breathe-glow {
      position: relative;
      isolation: isolate;
      border-radius: 999px;
      background: rgba(255, 0, 0, 0.22);
      box-shadow: 0 0 20px 20px rgba(255, 0, 0, 0.35);
      animation: focusInExpandLogo 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }

    .hero-logo-0086.breathe-glow::before {
      content: '';
      position: absolute;
      inset: 8% 4% 20% 4%;
      border-radius: 999px;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 0, 0, 0.95) 0 30%,
          rgba(255, 0, 0, 0.62) 48%,
          rgba(255, 0, 0, 0.28) 62%,
          rgba(255, 0, 0, 0) 78%
        );
      filter: blur(20px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 1;
      will-change: filter, opacity, box-shadow;
    }

    .desktop-window {
      position: absolute;
      border-top: 2px solid #f3f3f3;
      border-left: 2px solid #f3f3f3;
      border-right: 2px solid #4e4e4e;
      border-bottom: 2px solid #4e4e4e;
      background: #c9c9c9;
      z-index: 8;
      display: grid;
      grid-template-rows: 22px 1fr;
      overflow: hidden;
      font-family: Geneva, Tahoma, "MS Sans Serif", sans-serif;
      box-shadow: none;
    }

    .window-link {
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .desktop-window::before {
      content: '';
      position: absolute;
      inset: 0;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #757575;
      border-bottom: 1px solid #757575;
      pointer-events: none;
      z-index: 2;
    }

    .desktop-window .title {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      position: relative;
      font-size: 10px;
      color: #101010;
      text-transform: uppercase;
      background:
        repeating-linear-gradient(
          90deg,
          #ececec 0 2px,
          #d4d4d4 2px 4px
        );
      border-bottom: 1px solid #666;
      letter-spacing: 0.03em;
      font-weight: 700;
      z-index: 3;
    }

    .desktop-window .controls {
      position: absolute;
      left: 5px;
      top: 4px;
      display: flex;
      gap: 3px;
    }

    .desktop-window .close,
    .desktop-window .zoom {
      width: 11px;
      height: 11px;
      display: block;
      background: #d9d9d9;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #353535;
      border-bottom: 1px solid #353535;
      position: relative;
    }

    .desktop-window .close::after,
    .desktop-window .zoom::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid #4d4d4d;
    }

    .desktop-window .title-text {
      background: #dcdcdc;
      border-top: 1px solid #fff;
      border-left: 1px solid #fff;
      border-right: 1px solid #666;
      border-bottom: 1px solid #666;
      padding: 1px 8px 0;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .desktop-window .panel {
      background: #d3d3d3;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #7d7d7d;
      border-bottom: 1px solid #7d7d7d;
      margin: 1px;
      z-index: 1;
    }

    .desktop-window img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .win-bag {
      left: clamp(24px, 7vw, 140px);

    @keyframes floatWindow {

    @media (max-width: 900px) {

<body>
  <main>
    <section class="hero-wrap" aria-label="Hero">
      <div class="hero-still" aria-hidden="true"></div>
      <video class="hero-video" muted autoplay playsinline preload="auto" aria-label="Hero video">
        <source data-external-src="assets/home-hero.mp4" type="video/mp4" />
        <source data-external-src="assets/home-hero.mov" type="video/quicktime" />
      </video>
      <div class="hero-sound">
        <button type="button" class="hero-sound-toggle" aria-label="Toggle sound">Sound off</button>
      </div>
      <div class="hero-video-overlay" aria-hidden="true">
        <button type="button" class="hero-video-tap">Tap to play</button>
      </div>
      <div class="ambient-top" aria-hidden="true"></div>
      <div class="glow-overlay" aria-hidden="true">
        <div class="glow-red"></div>
        <div class="glow-gold"></div>
        <div class="glow-core"></div>
      </div>
      <div class="hotspots" aria-hidden="true">
        <a class="hero-hotspot hotspot-ai" href="file:///Users/andai007/Desktop/ShanhaiXMurakami/0086-ai.html"></a>
        <a class="hero-hotspot hotspot-art" href="file:///Users/andai007/Desktop/ShanhaiXMurakami/0086-service-ai-installation.html"></a>
        <a class="hero-hotspot hotspot-about" href="file:///Users/andai007/Desktop/ShanhaiXMurakami/0086-about.html"></a>
        <a class="hero-hotspot hotspot-contact" href="mailto:contact@0086studios.com"></a>
        <a class="hero-hotspot hotspot-back" href="#" data-action="back" aria-label="Back"></a>
      </div>

    </section>

  </main>
  <script>
    // Debug hotspots with: ?debug=1
    // Force ended state (show static clickable frame immediately): ?ended=1
    let forceEnded = false;
    try {
      const url = new URL(window.location.href);
      if (url.searchParams.get("debug") === "1") document.body.classList.add("debug-hotspots");
      if (url.searchParams.get("ended") === "1") forceEnded = true;
    } catch (_) {}

    // Hero video: autoplay (muted). When finished, reveal still image + buttons.
    (function initHeroVideo() {
      const wrap = document.querySelector(".hero-wrap");
      const video = document.querySelector(".hero-video");
      const overlay = document.querySelector(".hero-video-overlay");
      const tapBtn = document.querySelector(".hero-video-tap");
      const soundBtn = document.querySelector(".hero-sound-toggle");
      if (!wrap || !video) return;

      const updateSoundBtn = () => {
        if (!soundBtn) return;
        soundBtn.textContent = video.muted ? "Sound off" : "Sound on";
      };

      const tryPlay = () => {
        const p = video.play();
        if (p && typeof p.catch === "function") {
          p.catch(() => {
            wrap.classList.add("needs-tap");
          });
        }
      };

      const enableSoundAndPlay = () => {
        // Autoplay with sound is blocked by browsers; a user gesture (tap) can unlock it.
        video.muted = false;
        video.volume = 1;
        updateSoundBtn();
        tryPlay();
      };

      if (forceEnded) {
        wrap.classList.add("is-ended");
        video.pause();
        return;
      }

      video.addEventListener("ended", () => {
        wrap.classList.add("is-ended");
      });

      // In case the video is extremely short or fails to fire 'ended' reliably.
      video.addEventListener("timeupdate", () => {
        if (video.duration && video.currentTime >= video.duration - 0.05) {
          wrap.classList.add("is-ended");
        }
      });

      video.addEventListener("volumechange", updateSoundBtn);
      updateSoundBtn();

      if (soundBtn) {
        soundBtn.addEventListener("click", () => {
          if (video.muted) {
            enableSoundAndPlay();
            return;
          }
          video.muted = true;
          updateSoundBtn();
        });
      }

      if (tapBtn) {
        tapBtn.addEventListener("click", () => {
          wrap.classList.remove("needs-tap");
          enableSoundAndPlay();
        });
      }

      if (overlay) {
        overlay.addEventListener("click", () => {
          wrap.classList.remove("needs-tap");
          enableSoundAndPlay();
        });
      }

      tryPlay();
    })();

    let audioCtx;
    let audioReady = false;
    let audioEnabled = false;
    let breathingGain;

    function initAudio() {
      if (audioReady) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const mainGain = audioCtx.createGain();
      mainGain.gain.value = 0.12;
      mainGain.connect(audioCtx.destination);

      breathingGain = audioCtx.createGain();
      breathingGain.gain.value = 0;
      breathingGain.connect(mainGain);

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const g1 = audioCtx.createGain();
      const g2 = audioCtx.createGain();

      osc1.type = "sine";
      osc1.frequency.value = 80;
      osc2.type = "sine";
      osc2.frequency.value = 160;

      g1.gain.value = 0.06;
      g2.gain.value = 0.025;

      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.type = "sine";
      lfo.frequency.value = 1 / 3;
      lfoGain.gain.value = 0.05;

      lfo.connect(lfoGain);
      lfoGain.connect(g1.gain);

      osc1.connect(g1);
      osc2.connect(g2);
      g1.connect(breathingGain);
      g2.connect(breathingGain);

      osc1.start();
      osc2.start();
      lfo.start();

      audioReady = true;
    }

    async function ensureAudioContext() {
      initAudio();
      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }
    }

    function setBreathingSound(enabled) {
      if (!audioReady) return;
      const now = audioCtx.currentTime;
      breathingGain.gain.cancelScheduledValues(now);
      breathingGain.gain.setTargetAtTime(enabled ? 1 : 0, now, 0.25);
      audioEnabled = enabled;
    }

    function playHoverSound() {
      if (!audioReady || !audioEnabled) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = 520;
      g.gain.setValueAtTime(0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.3);
    }

    function playClickSound() {
      if (!audioReady || !audioEnabled) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(680, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(340, audioCtx.currentTime + 0.15);
      g.gain.setValueAtTime(0.1, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.25);
    }

    const hotspots = document.querySelectorAll(".hero-hotspot");

    document.addEventListener(
      "click",
      async () => {
        if (audioEnabled) return;
        await ensureAudioContext();
        setBreathingSound(true);
      },
      { once: true }
    );

    hotspots.forEach((hotspot) => {
      hotspot.addEventListener("mouseenter", playHoverSound);
      hotspot.addEventListener("focus", playHoverSound);
      hotspot.addEventListener("click", (e) => {
        e.preventDefault();
        playClickSound();
        const action = hotspot.dataset.action;
        if (action === "back") {
          setTimeout(() => { window.history.back(); }, 200);
          return;
        }
        const href = hotspot.getAttribute("href");
        setTimeout(() => { window.location.href = href; }, 200);
      });
    });
  </script>
  <script src="assets/external-media-config.js"></script>
  <script src="assets/external-media-loader.js"></script>
</body>

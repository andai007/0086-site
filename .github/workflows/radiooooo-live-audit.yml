name: Inspect Radiooooo live player
on:
  push:
    branches: [design/flat-weather-20261112]
    paths: [.github/workflows/radiooooo-live-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read the official public live player
        run: |
          mkdir -p /tmp/radio-audit
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, re, json
          from html.parser import HTMLParser
          root='https://stream.radiooooo.com/'
          out=pathlib.Path('/tmp/radio-audit')
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'0086-Preview-Integration-Check/1.0'})
            with urllib.request.urlopen(req,timeout=20) as r:
              data=r.read(1500000).decode('utf-8','replace')
              return data,{k:v for k,v in r.headers.items() if k.lower() in ['content-type','access-control-allow-origin','content-security-policy','x-frame-options']}
          html,headers=get(root)
          print('PUBLIC LIVE PLAYER HEADERS',json.dumps(headers))
          (out/'live.html').write_text(html)
          class Tags(HTMLParser):
            def __init__(self):super().__init__();self.scripts=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=='script' and d.get('src'):self.scripts.append(urllib.parse.urljoin(root,d['src']))
              if tag in ('audio','source'):print('MEDIA TAG',tag,d)
          p=Tags();p.feed(html)
          print('SCRIPTS',json.dumps(p.scripts))
          texts=[('HTML',html)]
          for i,url in enumerate(p.scripts):
            if urllib.parse.urlparse(url).hostname not in ['stream.radiooooo.com','radiooooo.com','app.radiooooo.com']:continue
            try:
              js,h=get(url);(out/('script-'+str(i)+'.js')).write_text(js);texts.append((url,js))
            except Exception as e:print('SCRIPT ERROR',str(e))
          for name,text in texts:
            print('\nSOURCE',name)
            hits=[]
            for match in re.finditer(r'(?:https?://[^\s\"\'<>`]+|.{0,90}(?:fetch\(|new Audio|audio\.src|\.m3u8|\.mp3|\.ogg|status-json|nowplaying|now-playing|metadata|/api/|/live).{0,170})',text,re.I):
              item=match.group(0)
              if item not in hits:hits.append(item)
            print('\n'.join(hits)[:19000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: radiooooo-public-player-source
          path: /tmp/radio-audit
          retention-days: 2

name: Verify Radiooooo preview music
on:
  push:
    branches: [design/flat-weather-20261112]
    paths: [.github/workflows/radiooooo-preview-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare browser
        run: |
          pip install playwright -q
          python -m playwright install chromium --with-deps >/dev/null
      - name: Verify public stream in real browser
        run: |
          mkdir -p /tmp/radio-verify
          cat > /tmp/check-radio.py <<'PY'
          import json, urllib.request, pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('/tmp/radio-verify')
          raw='https://raw.githubusercontent.com/andai007/0086-site/e1f626392d0290ed08d24d126dfad2062ec5c9fb/assets/preview-0086-radio-v5.js'
          js=urllib.request.urlopen(raw,timeout=25).read().decode()
          report={'source_commit':'e1f626392d0290ed08d24d126dfad2062ec5c9fb'}
          for name,url in [('metadata','https://stream.radiooooo.com/metadata.json'),('stream','https://stream.radiooooo.com/stream')]:
            req=urllib.request.Request(url,headers={'Origin':'https://andai007.github.io'})
            with urllib.request.urlopen(req,timeout=20) as r:
              item={'status':r.status,'type':r.headers.get('Content-Type'),'cors':r.headers.get('Access-Control-Allow-Origin')}
              if name=='metadata':item['body']=json.loads(r.read(20000))
              else:item['received_bytes']=len(r.read(1024))
              report[name]=item
          with sync_playwright() as p:
            browser=p.chromium.launch()
            page=browser.new_page(viewport={'width':1440,'height':900})
            errors=[];page.on('pageerror',lambda error: errors.append(str(error)))
            page.route('**/assets/preview-0086-music.js*',lambda route:route.fulfill(status=200,content_type='text/javascript',body=js))
            page.goto('https://andai007.github.io/0086-site/preview-0086.html?radio-test=5#/home',wait_until='domcontentloaded')
            page.wait_for_function("window.__0086Music?.mode === 'radiooooo-live'",timeout=30000)
            report['silent_on_load']=page.evaluate("document.querySelector('audio').paused && !document.querySelector('audio').getAttribute('src')")
            page.locator('.entry-link').first.click()
            page.wait_for_function('window.__0086Music.playing',timeout=30000)
            page.wait_for_function('window.__0086Music.audioTime > 3',timeout=15000)
            page.wait_for_function('Boolean(window.__0086Music.nowPlaying?.title)',timeout=15000)
            before=page.evaluate("({time:__0086Music.audioTime,src:document.querySelector('audio').src})")
            page.locator('.nav a[data-type=space]').click()
            page.wait_for_timeout(1800)
            after=page.evaluate("({time:__0086Music.audioTime,src:document.querySelector('audio').src,playing:__0086Music.playing,meta:__0086Music.nowPlaying,volume:document.querySelector('audio').volume})")
            report['navigation_continues']=before['src']==after['src'] and after['time']>before['time'] and after['playing']
            report['actual_playback']=after
            page.screenshot(path=str(out/'radio-desktop.png'))
            page.locator('#sound-toggle').click()
            report['mute_stops_request']=page.evaluate("document.querySelector('audio').paused && !document.querySelector('audio').getAttribute('src') && __0086Music.status==='off'")
            sizes=[]
            for width in [320,390,768,1440]:
              page.set_viewport_size({'width':width,'height':844})
              for lang in ['zh','en']:
                page.locator('[data-language='+lang+']').click()
                page.wait_for_timeout(150)
                sizes.append(page.evaluate('''() => {
                  const nodes=['#site-music','.site-language','.return-home'].map(s=>{const r=document.querySelector(s).getBoundingClientRect();return {s,x:r.x,y:r.y,w:r.width,h:r.height}});
                  const [a,...others]=nodes;
                  const overlap=others.some(b=>Math.min(a.x+a.w,b.x+b.w)>Math.max(a.x,b.x)&&Math.min(a.y+a.h,b.y+b.h)>Math.max(a.y,b.y));
                  return {width:innerWidth,lang:document.documentElement.lang,overlap,nodes,overflow:document.documentElement.scrollWidth>innerWidth};
                }'''))
              if width==390:page.screenshot(path=str(out/'radio-mobile.png'),full_page=True)
            report['layouts']=sizes
            report['page_errors']=errors
            page.close()
            failed=browser.new_page()
            failed.add_init_script("const nativeTimeout=window.setTimeout;window.setTimeout=(fn,ms,...args)=>nativeTimeout(fn,[1800,5000,12000].includes(ms)?30:ms,...args);")
            failed.route('**/assets/preview-0086-music.js*',lambda route:route.fulfill(status=200,content_type='text/javascript',body=js))
            failed.route('https://stream.radiooooo.com/**',lambda route:route.abort())
            failed.goto('https://andai007.github.io/0086-site/preview-0086.html?radio-error=5#/home',wait_until='domcontentloaded')
            failed.wait_for_function("window.__0086Music?.mode==='radiooooo-live'")
            failed.locator('#sound-toggle').click()
            failed.wait_for_function("__0086Music.status==='error'",timeout=15000)
            report['outage_honest']=failed.evaluate("!__0086Music.playing && document.querySelector('#sound-toggle').getAttribute('aria-pressed')==='false' && !document.querySelector('audio').getAttribute('src')")
            browser.close()
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert report['silent_on_load'] and report['navigation_continues'] and report['mute_stops_request'] and report['outage_honest']
          assert not errors
          assert not any(x['overflow'] or x['overlap'] for x in sizes), 'Responsive control overlap'
          PY
          python /tmp/check-radio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiooooo-preview-check
          path: /tmp/radio-verify
          retention-days: 2

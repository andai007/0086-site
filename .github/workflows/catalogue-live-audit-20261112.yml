name: Audit official 0086 catalogue
on:
  push:
    branches: [design/flat-weather-20261112]
    paths: [.github/workflows/catalogue-live-audit-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read official site and preview catalogue
        run: |
          mkdir -p /tmp/0086-catalogue-audit
          python3 - <<'PY'
          import urllib.request,urllib.parse,urllib.error,concurrent.futures,re,json,pathlib,hashlib
          from html.parser import HTMLParser
          out=pathlib.Path('/tmp/0086-catalogue-audit')
          class Parser(HTMLParser):
            def __init__(self):super().__init__();self.links=[];self.active=None;self.text=[];self.title='';self.in_title=False;self.ignore=0
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag in ['script','style']:self.ignore+=1
              if tag=='title':self.in_title=True
              if tag=='a':self.active={'href':d.get('href',''),'text':'','category':d.get('data-category'),'year':d.get('data-year'),'class':d.get('class',''),'images':[]}
              if tag=='img' and self.active is not None:self.active['images'].append({'src':d.get('src'),'alt':d.get('alt'),'data-src':d.get('data-src')})
            def handle_endtag(self,tag):
              if tag in ['script','style']:self.ignore=max(0,self.ignore-1)
              if tag=='title':self.in_title=False
              if tag=='a' and self.active is not None:self.active['text']=' '.join(self.active['text'].split());self.links.append(self.active);self.active=None
            def handle_data(self,data):
              if self.in_title:self.title+=data
              if not self.ignore:
                self.text.append(data)
                if self.active is not None:self.active['text']+=' '+data
          def fetch(url):
            result={'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; 0086-Catalogue-Audit/1.0)','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as r:
                raw=r.read(2500000);enc=r.headers.get_content_charset() or 'utf-8';text=raw.decode(enc,'replace');result.update(status=r.status,final_url=r.url,bytes=len(raw),headers={k:v for k,v in r.headers.items() if k.lower() in ['last-modified','etag','server','content-type']})
              name=hashlib.sha256(url.encode()).hexdigest()[:12]+'.html';(out/name).write_text(text)
              p=Parser();p.feed(text);result.update(title=p.title,links=p.links,text=' '.join(' '.join(p.text).split())[:18000],saved=name)
              if 'sitemap' in url:result['locations']=re.findall(r'<loc>(.*?)</loc>',text)
              if 'preview-0086-source' in url:result['snapshot']=re.findall(r"\['([^']*)','([^']*)',([0-9]+),'([^']*)','([^']*)'\]",text)
              if 'preview-0086.html' in url:result['neutral_language']='id=\\"language-neutral\\"' in text or 'language-neutral' in text
            except Exception as e:result['error']=str(e)
            return result
          roots=['https://0086studios.xyz/','https://www.0086studios.xyz/','http://0086studios.xyz/','https://andai007.github.io/0086-site/preview-0086-source.html','https://andai007.github.io/0086-site/preview-0086.html?v=9','https://raw.githubusercontent.com/andai007/0086-site/main/0086-service-ai-installation.html']
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:results=list(pool.map(fetch,roots))
          urls=set()
          for r in results[:3]:
            if r.get('status')!=200:continue
            for a in r.get('links',[]):
              u=urllib.parse.urljoin(r.get('final_url',r['url']),a['href']);part=urllib.parse.urlparse(u)
              if part.hostname in ['0086studios.xyz','www.0086studios.xyz'] and any(s in part.path.lower() for s in ['work','project','installation','case-','/art','/ai']):urls.add(u.split('#')[0])
          official=next((r.get('final_url',r['url']) for r in results[:3] if r.get('status')==200),'https://0086studios.xyz/')
          for path in ['sitemap.xml','robots.txt','0086-service-ai-installation.html','0086-work.html','0086-selected-works.html','0086-projects-nik-inspired.html']:urls.add(urllib.parse.urljoin(official,path))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:results+=list(pool.map(fetch,sorted(urls)[:35]))
          (out/'report.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          for r in results:
            print('\nPAGE',r['url'],'STATUS',r.get('status',r.get('error')),'TITLE',r.get('title'),'HEADERS',r.get('headers'))
            if r.get('neutral_language') is not None:print('LANGUAGE_PATCH_PUBLISHED',r['neutral_language'])
            if r.get('snapshot'):print('PREVIEW_SNAPSHOT',json.dumps(r['snapshot'],ensure_ascii=False))
            if r.get('locations'):print('SITEMAP',json.dumps(r['locations'],ensure_ascii=False))
            links=r.get('links',[])
            if links:print('LINKS',json.dumps(links,ensure_ascii=False))
            if r.get('status')==200 and not r.get('snapshot'):print('TEXT',r.get('text','')[:6500])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 0086-official-catalogue-audit
          path: /tmp/0086-catalogue-audit
          retention-days: 2

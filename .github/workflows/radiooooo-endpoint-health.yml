name: Radiooooo endpoint health
on:
  push:
    branches: [design/flat-weather-20261112]
    paths: [.github/workflows/radiooooo-endpoint-health.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Public endpoint availability
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json,time,re
          from concurrent.futures import ThreadPoolExecutor
          def check(path):
            url='https://stream.radiooooo.com'+path
            req=urllib.request.Request(url,headers={'Origin':'https://andai007.github.io'})
            try:
              with urllib.request.urlopen(req,timeout=12) as r:
                mime=r.headers.get('Content-Type','')
                body=r.read(2048)
                return {'path':path,'status':r.status,'type':mime,'cors':r.headers.get('Access-Control-Allow-Origin'),'bytes':len(body),'body':body.decode('utf-8','replace')[:1600] if not mime.startswith('audio/') else '(audio bytes discarded)'}
            except urllib.error.HTTPError as e:return {'path':path,'status':e.code,'body':e.read(400).decode('utf-8','replace')}
            except Exception as e:return {'path':path,'error':str(e)}
          paths=['/stream?t='+str(int(time.time())),'/metadata.json?t='+str(int(time.time())),'/status-json.xsl','/schedule.json']
          print(json.dumps(list(ThreadPoolExecutor(max_workers=4).map(check,paths)),ensure_ascii=False,indent=2))
          try:
            html=urllib.request.urlopen('https://app.radiooooo.com/',timeout=15).read(200000).decode()
            print('APP SCRIPTS',re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',html))
            print('APP IFRAME POLICY',dict(urllib.request.urlopen('https://app.radiooooo.com/',timeout=15).headers))
          except Exception as e:print(str(e))
          PY

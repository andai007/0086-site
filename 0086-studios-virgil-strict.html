<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0086 Studios™</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --white: #ffffff;
            --red: #ff0000;
            --gray-light: #f0f0f0;
            --gray-mid: #e0e0e0;
            --gray-dark: #999999;
            --logo-red-filter: brightness(0) saturate(100%) invert(10%) sepia(95%) saturate(7000%) hue-rotate(0deg) brightness(85%) contrast(120%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--white);
            color: var(--black);
            min-height: 100vh;
            position: relative;
        }

        /* 圆点网格底纹 - 严格匹配virgil */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #d8d8d8 8px, transparent 8px);
            background-size: 100px 100px;
            background-position: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* ========== 主内容区 ========== */
        main {
            position: relative;
            z-index: 1;
            padding-top: 0;
        }

        /* ========== Services区块 ========== */
        .services-section {
            padding: 0 40px 60px;
            margin-top: 320px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) clamp(72px, 8vw, 120px) minmax(0, 1fr);
            column-gap: clamp(8px, 1.2vw, 20px);
            row-gap: 0;
            align-items: center;
            margin-left: 200px;
        }

        .service-card {
            padding: 40px 32px 40px 72px;
            background: transparent;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .service-logo {
            height: 252px;
            display: block;
            margin-bottom: 8px;
            margin-left: -50px;
            object-fit: contain;
            object-position: left bottom;
            transition: filter 0.25s ease;
        }

        .service-divider {
            --divider-height: clamp(240px, 30vw, 420px);
            --divider-offset: clamp(-36px, -2vw, 0px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin-left: var(--divider-offset);
        }

        .divider-mask {
            height: var(--divider-height);
            overflow: hidden;
            display: block;
            animation: dividerTyping 3.2s steps(18) 0.2s infinite;
        }

        .service-divider img {
            height: var(--divider-height);
            width: auto;
            display: block;
        }


        .service-card:hover {
            background: rgba(255,255,255,0.6);
        }

        .service-card:hover .service-logo {
            filter: var(--logo-red-filter);
        }

        .service-number {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-dark);
            margin-bottom: 20px;
        }

        .service-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }


        .service-en {
            font-size: 11px;
            color: var(--gray-dark);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .service-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .service-tags span {
            font-size: 12px;
            padding: 8px 14px;
            background: rgba(240,240,240,0.7);
            color: #555;
            transition: all 0.2s;
        }

        .service-card:hover .service-tags span {
            background: rgba(230,230,230,0.9);
            color: #333;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 1280px) {
            .services-grid {
                margin-left: 96px;
                grid-template-columns: minmax(0, 1fr) clamp(56px, 7vw, 96px) minmax(0, 1fr);
            }
            .service-divider {
                --divider-height: clamp(200px, 24vw, 320px);
                --divider-offset: 0;
            }
        }

        @media (max-width: 1024px) {
            .services-section {
                margin-top: 260px;
                padding: 0 24px 48px;
            }
            .services-grid {
                grid-template-columns: minmax(0, 1fr) clamp(42px, 6vw, 68px) minmax(0, 1fr);
                margin-left: 16px;
                column-gap: 6px;
            }
            .service-card {
                padding: 28px 20px 32px 28px;
            }
            .service-logo {
                height: clamp(150px, 22vw, 220px);
                margin-left: -16px;
            }
            .service-divider {
                --divider-height: clamp(170px, 24vw, 240px);
                --divider-offset: 0;
                padding: 0;
            }
        }

        @media (max-width: 768px) {
            .services-section {
                padding: 40px 20px;
            }
            .services-grid {
                grid-template-columns: 1fr;
            }
            .service-card {
                border-right: none;
                border-bottom: 1px solid var(--gray-mid);
            }
            .service-divider {
                display: none;
            }
        }

        @keyframes dotDrift {
            0% { background-position: 50px 50px; }
            50% { background-position: 130px 90px; }
            100% { background-position: 50px 50px; }
        }

        @keyframes dividerTyping {
            from { height: 0; }
            to { height: var(--divider-height); }
        }

        @media (prefers-reduced-motion: reduce) {
            .divider-mask,
            .service-divider img {
                animation: none;
            }
        }

    </style>
</head>
<body>
    <main>
        <!-- Services -->
        <section class="services-section" id="services">
            <div class="services-grid">
                <a class="service-card" href="0086-service-ai-installation.html">
                    <img class="service-logo" src="assets/brand/art0086.svg" alt="art0086">
                    <p class="service-en">Interactive Installation & Cultural IP Exhibition</p>
                    <div class="service-tags">
                        <span>人像识别</span>
                        <span>实时生成</span>
                        <span>情感计算</span>
                        <span>空间叙事</span>
                        <span>数字化策展</span>
                        <span>品牌空间</span>
                        <span>跨界运营</span>
                        <span>国际资源</span>
                    </div>
                </a>

                <div class="service-divider" aria-hidden="true">
                    <span class="divider-mask">
                        <img src="assets/icons/icon5.svg" alt="">
                    </span>
                </div>

                <a class="service-card" href="0086-ai.html">
                    <img class="service-logo" src="assets/brand/ai0086.svg" alt="ai0086">
                    <p class="service-en">AI End-to-End Services</p>
                    <div class="service-tags">
                        <span>AI Agent</span>
                        <span>AIGC应用</span>
                        <span>策略咨询</span>
                        <span>系统设计</span>
                    </div>
                </a>
            </div>
        </section>

        
    </main>

</body>
</html>
